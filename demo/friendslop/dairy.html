<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>28天周期日记 - 周期博物馆</title>
    <!-- 引用提供的global.css，减少代码量 -->
    <link rel="stylesheet" href="global.css">
    <style>
        /* 补充：针对周期日记模块的特殊布局样式 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: var(--space-sm);
            margin-bottom: var(--space-lg);
        }
        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-md);
            font-size: var(--font-sm);
            cursor: pointer;
            position: relative;
            background: var(--white);
            box-shadow: var(--shadow-sm);
            transition: all var(--duration-fast) var(--ease);
        }
        .day-cell:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .day-cell.empty { background: transparent; box-shadow: none; cursor: default; }
        .day-cell.empty:hover { transform: none; }
        
        /* 状态颜色 */
        .day-cell.is-period { background: rgba(255, 107, 107, 0.15); color: #c62828; font-weight: var(--weight-bold); }
        .day-cell.is-ovulation { background: rgba(255, 167, 38, 0.15); color: #ef6c00; }
        .day-cell.is-follicular { background: rgba(100, 181, 246, 0.1); color: #1565c0; }
        .day-cell.is-luteal { background: rgba(149, 117, 205, 0.1); color: #4527a0; }
        
        /* 小图标指示器 */
        .cell-indicator {
            position: absolute;
            bottom: 4px;
            display: flex;
            gap: 2px;
        }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gray-70); }
        .dot.cramp { background: var(--error); }
        .dot.happy { background: var(--warning); }
        .dot.note { background: var(--info); }

        /* 覆写Modal样式，实现底部滑出面板 */
        .modal-overlay.sheet {
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--duration-normal) var(--ease);
        }
        .modal-overlay.sheet.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-overlay.sheet .modal {
            max-width: 100%;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            transform: translateY(100%);
            max-height: 85vh;
            transition: transform var(--duration-normal) var(--ease-out);
        }
        .modal-overlay.sheet.active .modal {
            transform: translateY(0);
        }
        
        /* 标签选中态 */
        .tag-btn {
            border: 1px solid var(--gray-30);
            background: var(--white);
            transition: all var(--duration-fast) var(--ease);
        }
        .tag-btn.selected {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
        }

    </style>
</head>
<body class="bg-gray-10">

    <div class="container main-content page-enter">
        <header class="navbar bg-white">
            <!-- 添加返回按钮 -->
            <a href="index.html" class="back-home-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                返回大厅
            </a>
            <h1 class="text-lg weight-medium">28天周期日记</h1>
            <button class="btn btn--ghost btn--sm" onclick="showReport()">月度报告</button>
        </header>

        <!-- 初始化设置面板 (默认隐藏) -->
        <section class="mt-4 p-4 card text-center" id="initSection" style="display: none;">
            <h2 class="text-md mb-3">👋 欢迎使用周期日记</h2>
            <p class="text-sm text-secondary mb-4">请先设置您的基础周期数据，我们将为您生成专属日历</p>
            <div class="form-group">
                <label class="form-label">最近一次月经开始日期</label>
                <input type="date" id="inputLastPeriod" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">平均周期长度(天)</label>
                <input type="number" id="inputCycleLength" class="form-control" value="28" min="21" max="40">
            </div>
            <button class="btn btn--primary btn--block mt-4" onclick="initCycleConfig()">生成我的日历</button>
        </section>

        <!-- 日历主体 -->
        <section class="mt-4 p-3 card" id="calendarSection">
            <div class="flex items-center justify-between mb-3">
                <button class="btn btn--ghost btn--sm" onclick="changeMonth(-1)">◀</button>
                <div class="text-md weight-medium" id="currentMonthLabel">2026年5月</div>
                <button class="btn btn--ghost btn--sm" onclick="changeMonth(1)">▶</button>
            </div>
            
            <div class="flex justify-center gap-2 mb-3 text-xs">
                <span class="cycle-indicator is-period">经期</span>
                <span class="cycle-indicator is-follicular">卵泡期</span>
                <span class="cycle-indicator is-ovulation">排卵期</span>
                <span class="cycle-indicator is-luteal">黄体期</span>
            </div>

            <!-- 星期头 -->
            <div class="calendar-grid text-xs text-gray text-center mb-1">
                <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
            </div>

            <!-- 日期格子容器 -->
            <div class="calendar-grid" id="calendarGrid">
                <!-- JS 动态生成 -->
            </div>
            <p class="text-xs text-gray text-center mt-2">* 仅为科学模型推算，仅供参考</p>
        </section>
    </div>

    <!-- 底部滑出详情面板 -->
    <div class="modal-overlay sheet" id="detailSheet">
        <div class="modal">
            <div class="modal-header">
                <div class="flex justify-between items-center">
                    <h2 class="text-md" id="sheetTitle">5月5日 · 周期第1天</h2>
                    <button class="btn text-gray" onclick="closeSheet()">✕</button>
                </div>
                <div class="mt-1">
                    <span class="cycle-indicator" id="sheetPhaseBadge">经期</span>
                </div>
            </div>
            <div class="modal-body">
                <!-- 上部分：科普 -->
                <div class="mb-4 p-3 bg-gray-10 rounded-md">
                    <div class="text-sm weight-medium mb-2">🧬 生理特点</div>
                    <p class="text-sm text-secondary line-loose" id="sheetScience">加载中...</p>
                    <div class="text-sm weight-medium mt-3 mb-2">💡 健康建议</div>
                    <p class="text-sm text-secondary line-loose" id="sheetAdvice">加载中...</p>
                </div>

                <!-- 中部分：记录区 -->
                <div class="mb-4">
                    <div class="text-sm weight-medium mb-2">📝 我的记录</div>
                    <div class="flex flex-wrap gap-2 mb-3" id="tagContainer">
                        <button class="btn btn--sm tag-btn" data-tag="cramp">腹痛</button>
                        <button class="btn btn--sm tag-btn" data-tag="fatigue">疲惫</button>
                        <button class="btn btn--sm tag-btn" data-tag="stable">情绪平稳</button>
                        <button class="btn btn--sm tag-btn" data-tag="energetic">精力充沛</button>
                        <button class="btn btn--sm tag-btn" data-tag="low">情绪低落</button>
                    </div>
                    <textarea class="form-control text-sm" rows="2" id="noteInput" placeholder="添加其他备注..."></textarea>
                </div>

                <!-- 下部分：关怀语 -->
                <div class="p-3 rounded-md text-center" style="background: var(--warm-yellow, #FFF3E0);">
                    <div class="text-lg ip-float">✨</div>
                    <p class="text-sm text-secondary mt-1 line-loose" id="sheetWarmWords">暖暖说：辛苦啦，今天给自己放个假吧～</p>
                </div>
            </div>
            <div class="modal-footer flex gap-3">
                <button class="btn btn--ghost flex-1" onclick="closeSheet()">取消</button>
                <button class="btn btn--primary flex-1" onclick="saveLog()">保存记录</button>
            </div>
        </div>
    </div>

    <script>
        // 主题初始化
        (function() {
            var t = localStorage.getItem('theme');
            if (t) document.documentElement.setAttribute('data-theme', t);
        })();

        // --- 数据结构定义 ---
        // 预置科普内容库 (根据28天周期模型简化示例)
        const knowledgeBase = {
            1: { phase: "is-period", phaseName: "经期", science: "子宫内膜脱落，身体正在排出代谢物，前列腺素分泌可能导致腹痛。", advice: "注意保暖，避免剧烈运动，可以饮用红糖姜茶缓解不适。", warmWords: "暖暖说：辛苦啦，今天给自己放个假吧～" },
            2: { phase: "is-period", phaseName: "经期", science: "经血量通常较多，身体可能感到沉重和乏力。", advice: "多休息，避免生冷食物，保持卫生。", warmWords: "暖暖说：你的身体正在努力工作，好好爱它～" },
            3: { phase: "is-period", phaseName: "经期", science: "激素水平处于最低点，情绪可能有些低落。", advice: "听些舒缓的音乐，做些让自己开心的小事。", warmWords: "暖暖说：抱抱，一切都会好起来的～" },
            4: { phase: "is-period", phaseName: "经期", science: "经血量开始减少，身体不适感逐渐减轻。", advice: "可以适当散步，促进血液循环。", warmWords: "暖暖说：你是最棒的，快熬过最难的时候啦～" },
            5: { phase: "is-period", phaseName: "经期", science: "经期即将结束，体力开始恢复。", advice: "补充铁质和蛋白质，为身体回血。", warmWords: "暖暖说：满血复活的你马上就要回来啦！" },
            6: { phase: "is-follicular", phaseName: "卵泡期", science: "雌激素开始上升，皮肤状态变好，精力逐渐恢复。", advice: "开始增加运动量，挑战新事物的好时机。", warmWords: "暖暖说：春天来了，万物复苏！" },
            12: { phase: "is-follicular", phaseName: "卵泡期", science: "雌激素持续上升，卵泡逐渐成熟，心情开朗。", advice: "适合社交和学习，大脑处于活跃期。", warmWords: "暖暖说：今天的你闪闪发光，去拥抱世界吧！" },
            14: { phase: "is-ovulation", phaseName: "排卵期", science: "卵子排出，雌激素达到高峰，此时魅力值MAX。", advice: "适合约会和重要展示，注意个人卫生。", warmWords: "暖暖说：你是今天的绝对主角！" },
            15: { phase: "is-ovulation", phaseName: "排卵期", science: "排卵后雌激素略降，孕酮开始上升。", advice: "保持规律作息，维持身体良好状态。", warmWords: "暖暖说：你的光芒还在继续哦～" },
            21: { phase: "is-luteal", phaseName: "黄体期", science: "孕酮达到高峰，身体可能开始出现水肿或疲惫。", advice: "减少盐分摄入，多吃富含维生素B的食物。", warmWords: "暖暖说：温柔对待自己，放慢脚步～" },
            26: { phase: "is-luteal", phaseName: "黄体期", science: "激素水平急速下降，经前综合征(PMS)可能出现。", advice: "避免高糖食物，做瑜伽拉伸放松身心。", warmWords: "暖暖说：深呼吸，不适只是暂时的访客～" },
            28: { phase: "is-luteal", phaseName: "黄体期", science: "周期最后一天，子宫内膜即将脱落。", advice: "准备好卫生用品，迎接下一个周期的重生。", warmWords: "暖暖说：每个周期都是全新的开始，期待明天！" }
        };

        // 为缺失的天数填充默认值，确保不报错
        for(let i=1; i<=28; i++) {
            if(!knowledgeBase[i]) {
                if(i<=5) knowledgeBase[i] = { phase: "is-period", phaseName: "经期", science: "经期中...", advice: "注意休息", warmWords: "暖暖说：辛苦啦" };
                else if(i<=13) knowledgeBase[i] = { phase: "is-follicular", phaseName: "卵泡期", science: "卵泡发育中...", advice: "保持活力", warmWords: "暖暖说：元气满满" };
                else if(i<=16) knowledgeBase[i] = { phase: "is-ovulation", phaseName: "排卵期", science: "排卵期中...", advice: "注意卫生", warmWords: "暖暖说：魅力四射" };
                else knowledgeBase[i] = { phase: "is-luteal", phaseName: "黄体期", science: "黄体期中...", advice: "放松心情", warmWords: "暖暖说：抱抱自己" };
            }
        }

        // --- 全局状态 ---
        let currentDisplayDate = new Date(); // 当前日历显示的月份
        let activeDateStr = null; // 当前选中的日期
        let cycleConfig = null; // 周期配置

        // --- 初始化逻辑 ---
        function init() {
            const savedConfig = localStorage.getItem('cycle_config');
            if (!savedConfig) {
                document.getElementById('initSection').style.display = 'block';
                document.getElementById('calendarSection').style.display = 'none';
            } else {
                cycleConfig = JSON.parse(savedConfig);
                document.getElementById('initSection').style.display = 'none';
                document.getElementById('calendarSection').style.display = 'block';
                renderCalendar();
            }
        }

        function initCycleConfig() {
            const dateVal = document.getElementById('inputLastPeriod').value;
            const lenVal = parseInt(document.getElementById('inputCycleLength').value);
            if(!dateVal) { alert('请选择日期'); return; }
            
            cycleConfig = {
                lastPeriodStart: dateVal,
                cycleLength: lenVal || 28
            };
            localStorage.setItem('cycle_config', JSON.stringify(cycleConfig));
            init();
        }

        // --- 日历渲染逻辑 ---
        function renderCalendar() {
            const year = currentDisplayDate.getFullYear();
            const month = currentDisplayDate.getMonth(); // 0-11
            
            document.getElementById('currentMonthLabel').innerText = `${year}年${month + 1}月`;
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            // 获取这个月的第一天是星期几 (0-6, 0=周日) 和总天数
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // 调整星期排列 (周一为第一天)
            const startOffset = firstDay === 0 ? 6 : firstDay - 1;

            // 填充空白
            for (let i = 0; i < startOffset; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell empty';
                grid.appendChild(emptyCell);
            }

            // 填充日期
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.setAttribute('data-date', dateStr);
                
                // 计算周期状态
                const cycleInfo = getCycleDayInfo(dateStr);
                if (cycleInfo) {
                    cell.classList.add(cycleInfo.phase);
                }

                // 读取本地记录状态并渲染小圆点
                const logs = getMonthLogs(year, month + 1);
                const dayLog = logs[dateStr];
                if(dayLog && (dayLog.symptoms.length > 0 || dayLog.note)) {
                    const indicator = document.createElement('div');
                    indicator.className = 'cell-indicator';
                    if(dayLog.symptoms.includes('cramp')) indicator.innerHTML += '<div class="dot cramp"></div>';
                    if(dayLog.symptoms.includes('energetic')) indicator.innerHTML += '<div class="dot happy"></div>';
                    if(dayLog.note) indicator.innerHTML += '<div class="dot note"></div>';
                    cell.appendChild(indicator);
                }

                const textNode = document.createTextNode(day);
                cell.appendChild(textNode);

                // 绑定点击事件
                cell.addEventListener('click', () => openDetailSheet(dateStr));
                grid.appendChild(cell);
            }
        }

        function changeMonth(offset) {
            currentDisplayDate.setMonth(currentDisplayDate.getMonth() + offset);
            renderCalendar();
        }

        // --- 周期计算核心 ---
        function getCycleDayInfo(dateStr) {
            if (!cycleConfig) return null;
            
            const targetDate = new Date(dateStr);
            const startDate = new Date(cycleConfig.lastPeriodStart);
            
            // 计算相差天数
            const diffTime = targetDate - startDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) return null; // 在设定开始日期之前的不计算

            const cycleDay = (diffDays % cycleConfig.cycleLength) + 1; // 1 到 cycleLength
            
            // 从知识库获取阶段信息，如果没有精确匹配，获取通用阶段
            let info = knowledgeBase[cycleDay];
            if(!info) {
                // 理论上已经补全，这里做保底
                if(cycleDay <= 5) info = knowledgeBase[1];
                else if(cycleDay <= 13) info = knowledgeBase[6];
                else if(cycleDay <= 16) info = knowledgeBase[14];
                else info = knowledgeBase[21];
            }
            
            return {
                day: cycleDay,
                phase: info.phase,
                phaseName: info.phaseName,
                ...info
            };
        }

        // --- 详情面板交互 ---
        function openDetailSheet(dateStr) {
            activeDateStr = dateStr;
            const info = getCycleDayInfo(dateStr);
            const dateObj = new Date(dateStr);
            
            // 更新面板标题和徽章
            document.getElementById('sheetTitle').innerText = `${dateObj.getMonth()+1}月${dateObj.getDate()}日 · 周期第${info ? info.day : '?'}天`;
            const badge = document.getElementById('sheetPhaseBadge');
            badge.innerText = info ? info.phaseName : '未知';
            badge.className = `cycle-indicator ${info ? info.phase : ''}`;

            // 更新科普内容
            document.getElementById('sheetScience').innerText = info ? info.science : '暂无数据';
            document.getElementById('sheetAdvice').innerText = info ? info.advice : '暂无建议';
            document.getElementById('sheetWarmWords').innerText = info ? info.warmWords : '';

            // 读取并回显本地记录
            const logs = getMonthLogs(dateObj.getFullYear(), dateObj.getMonth()+1);
            const dayLog = logs[dateStr] || { symptoms: [], note: '' };
            
            // 回显标签
            document.querySelectorAll('#tagContainer .tag-btn').forEach(btn => {
                const tag = btn.getAttribute('data-tag');
                if(dayLog.symptoms.includes(tag)) btn.classList.add('selected');
                else btn.classList.remove('selected');
            });
            
            // 回显备注
            document.getElementById('noteInput').value = dayLog.note || '';

            // 显示面板
            document.getElementById('detailSheet').classList.add('active');
        }

        function closeSheet() {
            document.getElementById('detailSheet').classList.remove('active');
            activeDateStr = null;
        }

        // 标签点击切换
        document.getElementById('tagContainer').addEventListener('click', function(e) {
            if(e.target.classList.contains('tag-btn')) {
                e.target.classList.toggle('selected');
            }
        });

        // --- 数据存储与保存 ---
        function getMonthLogs(year, month) {
            const key = `cycleLog_${year}${String(month).padStart(2, '0')}`;
            const data = localStorage.getItem(key);
            return data ? JSON.parse(data) : {};
        }

        function saveLog() {
            if(!activeDateStr) return;
            
            const dateObj = new Date(activeDateStr);
            const key = `cycleLog_${dateObj.getFullYear()}${String(dateObj.getMonth()+1).padStart(2, '0')}`;
            const logs = getMonthLogs(dateObj.getFullYear(), dateObj.getMonth()+1);

            // 收集选中的标签
            const selectedTags = [];
            document.querySelectorAll('#tagContainer .tag-btn.selected').forEach(btn => {
                selectedTags.push(btn.getAttribute('data-tag'));
            });

            // 收集备注
            const noteVal = document.getElementById('noteInput').value.trim();

            // 如果有内容则保存，如果全空则删除该日记录
            if(selectedTags.length > 0 || noteVal !== '') {
                logs[activeDateStr] = {
                    symptoms: selectedTags,
                    note: noteVal
                };
            } else {
                delete logs[activeDateStr];
            }

            localStorage.setItem(key, JSON.stringify(logs));
            
            // 重新渲染日历以更新小圆点
            renderCalendar();
            closeSheet();
            
            // 简单的反馈提示
            showToast('记录已保存');
        }

        // 简单的Toast提示
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-90 text-white px-4 py-2 rounded-md shadow-lg z-50';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 1500);
        }

        function showReport() {
            alert('月度报告功能开发中，敬请期待！');
        }

        // 启动应用
        init();
    </script>
